<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Vermont Edition - Town by Town</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

	<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
	<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
	<script src="https://unpkg.com/@protomaps/basemaps@5.7.2/dist/basemaps.js"></script>

	<link rel="stylesheet" href="style.css" />
</head>
<body>

	<div id="map"></div>

	<div id="panel">
		<div class="panel-handle"></div>

		<div id="panel-header">
			<h1>Town by Town</h1>
			<p>Vermont Public's Vermont Edition spotlights a different Vermont town each month. Here are the town's we been to so far 🗺️</p>
		</div>

		<div id="episode-list"></div>

		<div id="episode-detail">
			<button id="back-button">&larr; Back to list</button>
			<h2 id="detail-town"></h2>
			<div id="detail-date"></div>
			<p id="detail-summary"></p>
			<a id="detail-link" target="_blank" rel="noopener">Listen on Vermont Public &rarr;</a>
		</div>
	</div>

	<script type="module" src="script.js"></script>
</body>
</html>
